name = "tc-block-api"
main = "src/index.js"
compatibility_date = "2026-09-27"
preview_urls = false

[vars]
LOCAL_DEV = "false"
# Fill in exact production origins. Missing values fail closed.
API_ORIGIN = ""
ADMIN_ORIGIN = ""
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
EXTENSION_IDS = ""

[limits]
cpu_ms = 50

[observability]
enabled = true
head_sampling_rate = 0.1

# Unique namespaces per application/account. Approximate limits per Cloudflare location.
[[ratelimits]]
name = "INGRESS_LIMITER"
namespace_id = "33601"
simple = { limit = 180, period = 60 }

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "33602"
simple = { limit = 40, period = 60 }

[[ratelimits]]
name = "REPORTER_LIMITER"
namespace_id = "33603"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "33604"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "DB_LIMITER"
namespace_id = "33605"
simple = { limit = 1000, period = 60 }

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "tc-block-db"
database_id = "tc-block-db-local-id"
